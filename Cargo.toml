[package]
name = "loading-chip"
version = "0.2.0"
edition = "2024"
description = "嵌入式芯片烧录/调试 TUI 工具 — 支持 probe-rs / OpenOCD / pyOCD / GDB"
license = "MIT"

[[bin]]
name = "loading-chip"
path = "src/main.rs"

[features]
default = ["debug"]
debug = ["dep:probe-rs"]

[dependencies]
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
probe-rs = { version = "0.31", optional = true }
crossbeam-channel = "0.5"
nix = { version = "0.30", features = ["signal", "process"] }
shellexpand = "3"
dirs = "6"
object = { version = "0.38", default-features = false, features = ["read_core", "elf"] }
